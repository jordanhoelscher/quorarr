<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Quorarr">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1622" />
      <stop offset="1" stop-color="#04060a" />
    </linearGradient>
    <radialGradient id="vapour" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#7ce0e6" stop-opacity="0.30" />
      <stop offset="1" stop-color="#7ce0e6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="strand" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#7ce0e6" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#stone)" />
  <rect width="100" height="100" rx="22" fill="url(#vapour)" />
  <rect x="0.5" y="0.5" width="99" height="99" rx="21.5" fill="none" stroke="#7ce0e6" stroke-opacity="0.22" />

  <!--
    Stroked centrelines, matching the "Q" geometry in scripts/make-icons.py:
    ring centre (50,50) with radii 20 x 24, tail struck at 45 degrees.
    Keep the two in step if either changes.
  -->
  <g fill="none" stroke="url(#strand)" stroke-width="8.8" stroke-linecap="round">
    <ellipse cx="50" cy="50" rx="20" ry="24" />
    <path d="M57.5 60.5 L75.5 78.5" />
  </g>

</svg>
