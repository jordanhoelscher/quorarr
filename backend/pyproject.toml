[project]
name = "pensieve"
# Read from ``pensieve.__version__`` rather than repeated here: the packaging
# metadata sat at 0.1.0 for nine releases while /health and the UI footer
# reported the real number, which made "what is actually deployed" a question
# with two answers.
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.4",
    "pywebpush>=2.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "pensieve.__version__" }

[tool.setuptools.packages.find]
include = ["pensieve*"]
