name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jordanhoelscher/quorarr

jobs:
  image:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU is what makes the arm64 leg possible on an amd64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Every line of `tags` below is an input to the action, not YAML —
          # a `#` inside that block scalar would be handed to metadata-action
          # as a tag pattern, so explanations live out here.
          #
          # `latest` is skipped for any tag containing `-` (v1.2.0-rc1 and
          # friends): a pre-release must not become what a fresh
          # `docker compose pull` gets. The bare `{{major}}` tag is skipped
          # for v0.x, where `:0` would promise a stability 0.x has not earned.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=Quorarr
            org.opencontainers.image.description=Shared library governance for Plex
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # After the image, deliberately: a release page that announces a version
    # whose image failed to build sends people to a `docker pull` that 404s.
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The changelog is the single source of the release notes -- there is no
      # second copy to drift. No section for this tag fails the job rather than
      # publishing an empty release page.
      - name: Extract release notes
        run: python3 .github/changelog-section.py CHANGELOG.md "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # `--prerelease` mirrors the image job's `latest` rule: any tag with a
        # `-` in it (v1.2.0-rc1) is not what a fresh install should land on.
        #
        # The test is an `if`, not `cond && flags+=(...)`: steps run under
        # `bash -e`, where a bare test that is false is itself a failed command
        # and would abort the step on every ordinary (non-prerelease) tag.
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            "${flags[@]}"
